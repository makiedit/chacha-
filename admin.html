<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የማስታወቂያ ማስተዳደሪያ ገጽ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f6f9; padding: 20px; }
    .container { max-width: 900px; margin: auto; }
    
    .login-card { max-width: 380px; margin: 80px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
    .login-card input { width: 100%; padding: 10px; margin: 12px 0; border: 1px solid #ccc; border-radius: 5px; }
    
    .admin-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    .btn { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }
    .btn-primary { background: #8b0000; color: #fff; }
    .btn-danger { background: #dc3545; color: #fff; padding: 6px 12px; font-size: 0.85rem; }
    .btn-secondary { background: #555; color: #fff; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
    .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    
    .announcement-list { margin-top: 15px; }
    .announcement-item { background: #fff; border: 1px solid #ddd; border-left: 4px solid #8b0000; padding: 15px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .ann-info h4 { font-size: 1rem; color: #333; margin-bottom: 5px; }
    .ann-info p { font-size: 0.85rem; color: #666; }
    .ann-info small { font-size: 0.75rem; color: #999; }
  </style>
</head>
<body>

  <div class="container">

    <!-- 1. መግቢያ (LOGIN) SECTION -->
    <div id="loginCard" class="login-card">
      <h2 style="color:#8b0000;"><i class="fa-solid fa-lock"></i> የአድሚን መግቢያ</h2>
      <p style="font-size:0.85rem; color:#666; margin-top:5px;">የይለፍ ቃል ያስገቡ (ነባሪ፡ 1234)</p>
      <input type="password" id="passInput" placeholder="Password">
      <button onclick="login()" class="btn btn-primary" style="width: 100%;">ግበታ (Login)</button>
      <p id="errMsg" style="color:red; display:none; margin-top:10px; font-size:0.85rem;">የተሳሳተ የይለፍ ቃል ነው!</p>
    </div>

    <!-- 2. የአድሚን ማስተዳደሪያ (ADMIN DASHBOARD) SECTION -->
    <div id="adminDash" style="display: none;">
      
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2><i class="fa-solid fa-user-shield"></i> የሰንበት ትምህርት ቤት ማስታወቂያዎች ማስተዳደሪያ</h2>
        <div>
          <a href="index.html" class="btn btn-secondary" target="_blank"><i class="fa-solid fa-eye"></i> ገጹን እይ</a>
          <button onclick="logout()" class="btn" style="background:#888; color:#fff;">ውጣ</button>
        </div>
      </div>

      <!-- አዲስ ማስታወቂያ መጫኛ ፎርም -->
      <div class="admin-card">
        <h3><i class="fa-solid fa-bullhorn"></i> አዲስ ማስታወቂያ ልቀቅ</h3>
        <form id="annForm" style="margin-top:15px;">
          <div class="form-group">
            <label>ቀን (ለምሳሌ፡ 15 መስከረም)</label>
            <input type="text" id="annDate" placeholder="ለምሳሌ፡ 20 ጥቅምት" required>
          </div>
          <div class="form-group">
            <label>የማስታወቂያ ርዕስ</label>
            <input type="text" id="annTitle" placeholder="ለምሳሌ፡ የአዲስ ተማሪዎች ምዝገባ ጀመረ" required>
          </div>
          <div class="form-group">
            <label>ዝርዝር መግለጫ</label>
            <textarea id="annDesc" rows="3" placeholder="ስለ ማስታወቂያው ዝርዝር መረጃ እዚህ ይጻፉ..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> ማስታወቂያውን ለጥፍ</button>
        </form>
      </div>

      <!-- የነበሩ ማስታወቂያዎች ዝርዝርና ማጥፊያ -->
      <div class="admin-card">
        <h3><i class="fa-solid fa-list"></i> የነበሩ ማስታወቂያዎች (<span id="count">0</span>)</h3>
        <div class="announcement-list" id="adminAnnList"></div>
      </div>

    </div>

  </div>

  <script>
    const PASS = "1234";

    const defaultAnnouncements = [
      { id: 1, date: "15 መስከረም", title: "የአዲስ ተማሪዎች ምዝገባ ተጀመረ", desc: "ሁሉም ጥርጊያውን ተከትሎ መጥቶ መመዝገብ ይችላል።" },
      { id: 2, date: "20 መስከረም", title: "ልዩ የመዝሙር የሊቃውንት ጉባኤ", desc: "እሁድ ከሰዓት በኋላ በቤተክርስቲያናችን አዳራሽ ይካሄዳል።" }
    ];

    function getStoredAnnouncements() {
      try {
        const stored = localStorage.getItem('sundayschool_announcements');
        if (!stored) {
          localStorage.setItem('sundayschool_announcements', JSON.stringify(defaultAnnouncements));
          return defaultAnnouncements;
        }
        return JSON.parse(stored);
      } catch (e) {
        return defaultAnnouncements;
      }
    }

    function login() {
      const input = document.getElementById('passInput').value;
      if (input === PASS) {
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('adminDash').style.display = 'block';
        renderAdminAnnList();
      } else {
        document.getElementById('errMsg').style.display = 'block';
      }
    }

    function logout() {
      location.reload();
    }

    function renderAdminAnnList() {
      const anns = getStoredAnnouncements();
      const listDiv = document.getElementById('adminAnnList');
      document.getElementById('count').innerText = anns.length;
      listDiv.innerHTML = '';

      anns.forEach(item => {
        const div = document.createElement('div');
        div.className = 'announcement-item';
        div.innerHTML = `
          <div class="ann-info">
            <small><i class="fa-solid fa-calendar-days"></i> ${item.date}</small>
            <h4>${item.title}</h4>
            <p>${item.desc}</p>
          </div>
          <button class="btn btn-danger" onclick="deleteAnnouncement(${item.id})"><i class="fa-solid fa-trash"></i> አጥፋ</button>
        `;
        listDiv.appendChild(div);
      });
    }

    // ማስታወቂያ መጨመር
    document.getElementById('annForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const date = document.getElementById('annDate').value;
      const title = document.getElementById('annTitle').value;
      const desc = document.getElementById('annDesc').value;

      const anns = getStoredAnnouncements();
      anns.unshift({ id: Date.now(), date, title, desc });
      
      localStorage.setItem('sundayschool_announcements', JSON.stringify(anns));
      renderAdminAnnList();
      this.reset();
      alert('ማስታወቂያው በስኬት ተለጠፈ!');
    });

    // ማስታወቂያ ማጥፋት
    function deleteAnnouncement(id) {
      if (confirm('እርግጠኛ ነዎት ይህን ማስታወቂያ ማጥፋት ይፈልጋሉ?')) {
        let anns = getStoredAnnouncements();
        anns = anns.anns.filter ? anns.filter(a => a.id !== id) : anns.filter(a => a.id !== id);
        localStorage.setItem('sundayschool_announcements', JSON.stringify(anns));
        renderAdminAnnList();
      }
    }
  </script>
</body>
</html>
